<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Rapid Fermentation Stage</title>
<style>
@font-face { font-family: "BIZ UDPGothic"; src: url("BIZUDPGothic-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "BIZ UDPGothic"; src: url("BIZUDPGothic-Bold.ttf"); font-weight: 700; }
:root {
  --bg: #F4F6F1; --ink: #1E2A24; --muted: #5C6B63; --line: #C9D2CB; --card: #FFFFFF;
  --green: #2E6B4A; --green-d: #1D4A33; --green-l: #DCEADF;
  --amber: #D38B22; --amber-l: #F7E7CB;
  --soil: #8A5A3C; --soil-l: #EEDFD3;
  --water: #2B7BB0; --water-l: #D7E8F4;
  --red: #B5513A; --red-l: #F4DDD5;
  --gray: #87928B; --gray-l: #E6EAE6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: "BIZ UDPGothic", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; }
#scene { position: absolute; inset: 0; }
#scene > svg.g { position: absolute; left: 0; top: 0; }
.abs { position: absolute; }
.heading { position: absolute; left: 120px; top: 104px; width: 1680px; font-size: 54px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; }
.heading .bar { display: block; width: 84px; height: 7px; background: var(--amber); border-radius: 4px; margin-top: 18px; }
.card { position: absolute; background: var(--card); border-radius: 22px; box-shadow: 0 6px 22px rgba(30, 42, 36, 0.08); }
.t-title { font-weight: 700; }
.note { position: absolute; font-size: 24px; color: var(--muted); }
.chip { display: inline-block; padding: 8px 20px; border-radius: 999px; font-weight: 700; font-size: 26px; }
.center { display: flex; align-items: center; justify-content: center; text-align: center; }
.icoc { display: flex; align-items: center; justify-content: center; border-radius: 50%; }
/* chrome */
#chrome { position: absolute; inset: 0; pointer-events: none; }
#brand { position: absolute; left: 120px; top: 40px; display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 700; color: var(--green-d); }
#brand .rule { width: 7px; height: 32px; background: var(--green); border-radius: 2px; }
#chapter { position: absolute; right: 120px; top: 40px; display: flex; align-items: center; gap: 14px; font-size: 26px; color: var(--muted); }
#chapter .num { font-weight: 700; color: var(--green); }
#chapter .name { font-weight: 700; color: var(--ink); }
#progress { position: absolute; left: 120px; right: 120px; top: 1046px; height: 6px; display: flex; gap: 10px; }
#progress .seg { position: relative; height: 6px; background: #DDE3DE; border-radius: 3px; overflow: hidden; }
#progress .seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 3px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scene"></div>
  <div id="chrome">
    <div id="brand"><span class="rule"></span><span id="brandName"></span></div>
    <div id="chapter"><span class="num" id="chapNum"></span><span class="name" id="chapName"></span></div>
    <div id="progress"></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="core.js"></script>
<script src="scenes.js"></script>
</body>
</html>
